baseURL: 'https://www.liuchang0812.com/'
languageCode: zh-cn
title: 读书与编程
theme: PaperMod
enableInlineShortcodes: true
enableEmoji: true
enableRobotsTXT: true
hasCJKLanguage: true

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  social: true
  disableSpecial1stPost: true
  ShowCodeCopyButtons: true
  ShowPostNavLinks: true
  ShowReadingTime: true
  ShowToc: true
  TocOpen: false
  DateFormat: "2006-01-02"
  env: production
  
  fuseOpts:
      isCaseSensitive: false
      shouldSort: true
      location: 0
      distance: 1000
      threshold: 1
      minMatchCharLength: 0
      keys: ["title", "permalink", "summary"]      

markup:
  highlight:
        codeFences: true  
        guessSyntax: true
        lineNos: false
        style: darcula
    
menu:
  main:
    - name: 🙋🏻‍♂️关于
      url: /about/
      weight: 4
      
    - name: ⏱时间轴
      url: /archives/
      weight: 3
      
    - name: 🔍搜索
      url: /search/
      weight: 2
      
    - identifier: posts
      name: 📚文章
      url: posts
      weight: 1
